name: CI

# Uniquement sur pull request : GitHub y teste la fusion d'essai de la branche
# avec `master`, c'est-à-dire exactement ce qui arrivera sur `master` à la
# fusion. Relancer ensuite sur `push` refaisait le même travail une seconde
# fois. `master` n'est donc vérifié qu'à travers les pull requests — ce qui
# suppose de ne pas y pousser directement. `workflow_dispatch` permet de
# vérifier une branche à la main.
on:
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche : les suivantes annulent la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Les avertissements sont des erreurs en intégration continue : un projet de
  # sécurité n'a pas à laisser filer un `unused` ou un lint clippy.
  RUSTFLAGS: -D warnings

jobs:
  # Qualité et tests : un seul système suffit, le code n'est pas spécifique à
  # une plateforme. Les compilations multiplateformes sont vérifiées à part.
  quality:
    name: Qualité et tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm --prefix app ci

      - name: Format Rust
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Tests Rust
        run: cargo test --workspace

      - name: Tests d'intégration de la CLI
        # Ignorés par défaut : chacun effectue de vraies dérivations Argon2id.
        run: cargo test --release -p coopacrypt-cli -- --ignored

      - name: Typage et bundle du front
        run: npm --prefix app run build

      - name: Tests du front
        run: npm --prefix app test

      # Garde-fou du format de fichier. Les vecteurs sont gelés : les
      # régénérer revient à changer les valeurs par défaut, ce qui doit être
      # délibéré. Placé ici plutôt que dans un travail à part : le cœur est
      # déjà compilé en release par les tests d'intégration de la CLI.
      - name: Vecteurs de test gelés
        run: |
          cargo run --release --example gen_vectors -p coopacrypt-core
          if ! git diff --quiet -- crates/coopacrypt-core/tests/vectors.json; then
            echo "::error::Les vecteurs de test ne correspondent plus au code."
            echo "Le format ou les paramètres par défaut ont changé."
            echo "Si c'est délibéré, committez le vectors.json régénéré."
            git diff --stat -- crates/coopacrypt-core/tests/vectors.json
            exit 1
          fi

  # Vérifie que l'application se compile partout où elle est distribuée. On ne
  # produit pas les paquets ici : c'est long, et c'est le rôle de la release.
  compile:
    name: Compilation ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: 'Linux x64' }
          - { os: windows-latest, label: 'Windows x64' }
          - { os: macos-latest, label: 'macOS ARM64' }
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances système Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable
      # Le profil fait partie de la clé : la clé par défaut ne dépend que du
      # Cargo.lock, et un cache rempli d'artefacts release serait restauré tel
      # quel, considéré à jour, et jamais complété par les artefacts debug —
      # chaque exécution recompilerait alors tout.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-debug

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm --prefix app ci

      # Le bundle du front doit exister : la génération du contexte Tauri
      # vérifie la présence de `frontendDist`.
      - run: npm --prefix app run build

      # Profil debug, pas release : le profil release (LTO, une seule unité
      # de codegen) multiplie le temps de compilation sans rien apprendre de
      # plus sur la portabilité du code. Les vrais paquets sont construits
      # par la release.
      - name: Compiler l'application et la CLI
        run: cargo build --workspace
