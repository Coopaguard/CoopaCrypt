[workspace]
resolver = "2"
members = ["crates/coopacrypt-core", "crates/coopacrypt-cli", "crates/coopacrypt-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/Coopaguard/CoopaCrypt"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
